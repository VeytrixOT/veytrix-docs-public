site_name: Veytrix | Documentation
site_description: Veytrix OT Asset & Security Intelligence — product and developer documentation
site_url: https://veytrixot.github.io/veytrix-docs-public/
repo_url: https://github.com/VeytrixOT/veytrix-docs-public
repo_name: VeytrixOT/veytrix-docs-public
docs_dir: docs
site_dir: site
theme:
  name: material
  logo: assets/veytrix-symbol.svg
  favicon: assets/veytrix-symbol.svg
  font:
    text: Inter
    code: Roboto Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
extra_css:
  - assets/stylesheets/veytrix.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Start here: index.md
  - Platform:
      - Overview: platform/overview.md
      - How it works: platform/how-it-works.md
      - Delivery roadmap: platform/roadmap.md
  - Developers:
      - Repository map: developers/repositories.md
      - Data and plugin concepts: developers/concepts.md
  - Brand: brand.md
